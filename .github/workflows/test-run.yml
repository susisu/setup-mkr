name: "Test Run"

on:
  workflow_dispatch:
    inputs:
      version:
        description: "The version of mkr to install."

jobs:
  run:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os:
          - ubuntu-latest
          - macos-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./
        with:
          mkr-version: ${{ github.event.inputs.version }}
      - run: mkr org
        env:
          MACKEREL_APIKEY: ${{ secrets.TEST_MACKEREL_APIKEY }}
